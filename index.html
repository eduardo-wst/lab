<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Folículos interativos</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #080b0a;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let mouse = {
  x: -1000,
  y: -1000
};

const particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 1500; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,

    // posição original
    ox: 0,
    oy: 0,

    angle: Math.random() * Math.PI * 2,
    size: 3 + Math.random() * 8
  });
}

// Guarda a posição original
particles.forEach(p => {
  p.ox = p.x;
  p.oy = p.y;
});

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particles) {

    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    // raio de influência do mouse
    const radius = 120;

    if (distance < radius) {

      // força de repulsão
      const force = (radius - distance) / radius;

      p.x += (dx / distance) * force * 3;
      p.y += (dy / distance) * force * 3;
    }

    // retorno suave à posição original
    p.x += (p.ox - p.x) * 0.04;
    p.y += (p.oy - p.y) * 0.04;

    // direção do folículo
    const angle = Math.atan2(
      mouse.y - p.y,
      mouse.x - p.x
    );

    ctx.save();

    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    ctx.strokeStyle = "#6f8f76";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(p.size, 0);
    ctx.stroke();

    ctx.restore();
  }

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
